name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gundam-os.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gundam-os-apk
          path: gundam-os.apk

      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GUNDAM OS (latest build)
          body: "最新ビルド。下の gundam-os.apk をスマホでダウンロードしてインストールしてください。"
          files: gundam-os.apk
