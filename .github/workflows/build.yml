name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Read versionCode
        id: ver
        run: |
          CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gundam-os.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gundam-os-apk
          path: gundam-os.apk

      - name: Publish versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: "Z GUNDAM OS v${{ steps.ver.outputs.code }}"
          body: |
            最新ビルド。下の gundam-os.apk をスマホのブラウザでダウンロードしてインストールしてください。

            ※ v4 より前の版が入っている場合は、一度アンインストールしてから入れてください（署名を固定したため、この1回だけ必要です）。
          files: gundam-os.apk
